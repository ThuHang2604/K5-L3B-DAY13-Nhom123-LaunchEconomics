# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
# Số tính bằng src/lab13.py (hàm co_mau, he_so_thiet_ke, power_hai_ti_le).
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: co_mau(0,70; 0,75) = 1.251 yêu cầu mỗi nhóm
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48; n = 1.251 × 2,48 = 3.103 mỗi nhóm → 42 người/nhóm, tổng 84 > 40: không đủ người
#   c) 20 nhân viên mỗi nhóm: hiệu dụng tối đa c / ICC = 20 / 0,02 = 1.000 < 1.251: không đạt mức 5 điểm
#   d) 6 depot mỗi nhóm: hiệu dụng tối đa 6 / 0,02 = 300: loại
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: 20m / (0,98 + 0,02m) ≥ 859 → m ≥ 299 yêu cầu/người (DE 6,96)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (theo nhân viên, 20 + 20):
#   1. Đối chứng chạy cùng thời gian: có, 20 nhân viên đối chứng làm cùng tuần, cùng depot với 20 nhân viên dùng trợ lý
#   2. Chia ngẫu nhiên hay do người chọn: bốc thăm bằng code, seed 20261201 ghi trước, phân tầng theo depot
#   3. Ảnh hưởng gián tiếp và cách giảm: rủi ro chia sẻ câu trả lời trong depot; quyền dùng trợ lý theo tài khoản, log lượt mở theo staff_id
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: có, chốt trong file này trước ngày bắt đầu 2026-12-01
#   5. Ít nhất 20 cụm mỗi nhóm: có, đúng 20 cụm mỗi nhóm (40 nhân viên CSKH)
#
# Đánh đổi đã chấp nhận: 20 + 20 nhân viên không đủ mẫu cho mức chênh 5 điểm (tối đa 1.000 < 1.251),
#   nên chọn MDE 6 điểm (859 hiệu dụng mỗi nhóm, cần ≥ 299 yêu cầu/nhân viên). Nếu tác động thật chỉ 5 điểm,
#   power chỉ còn 0,64. Giám đốc vận hành phải ký chấp nhận con số này trước ngày bắt đầu.
#   Khả thi về khối lượng: 45.000 yc/tháng ÷ 40 người ≈ 1.125 yc/người/tháng, phạm vi chiếm 982/1.200 = 82%
#   → khoảng 920 yc trong phạm vi/người/tháng, nên 299 yc/người đạt sau khoảng 10 ngày làm việc ở bước 0.50.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn: toàn mẫu 4,25% (51/1.200);
#   trong phạm vi noi_dia + hang_nang 3,97% (39/982). Ngưỡng tuyệt đối 3% sẽ dừng pilot ngay tuần đầu,
#   nên dùng chênh so với đối chứng ≥ 2 điểm, kèm trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang (0,22× và 0,69× so với 12.000 đ, simulated), 12 depot; loại quoc_te (1,88×, thành công 27,3%, chạy lại lần 3 chỉ đúng 2,2%) và doi_tac (0,85×, điều khoản riêng)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần: 4 → 10 → 20 nhân viên nhóm can thiệp; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận: 5 điểm không đủ mẫu với 40 nhân viên
    alpha: 0.05
    power: 0.80
    n_per_arm: 859                # hiệu dụng; cần ≥ 299 yêu cầu/nhân viên, tức ≥ 5.980 yêu cầu thực mỗi nhóm
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng tuần, cùng depot, phân tầng theo depot"
    spillover_risk: "Trung bình: nhân viên cùng depot có thể chia sẻ câu trả lời; giảm bằng quyền theo tài khoản và log agent_suggestion_shown theo staff_id"
    predeclared: "Có: chỉ số chính, MDE 0,06, ba luật dừng và ngày quyết định chốt trong file này trước ngày bắt đầu 2026-12-01; seed bốc thăm 20261201"
  stop_rules:
    - "NẾU tỉ lệ mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng từ 2 điểm trở lên, hoặc vượt 6%, hoặc có từ 1 ca hoàn trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và Kỹ sư trưởng agent rà toàn bộ trace của các ca đó KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công (đã cộng cố định, đo bằng phút thật) vượt 8.000 đ TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được mở lại hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý (sửa + bỏ trên số được xem lại) vượt 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên nhóm can thiệp trong 3 ngày và báo cáo cho PM trợ lý hoàn phí KHÔNG THÌ không được chuyển bước rollout"
    - "NẾU tỉ lệ làm lại trong phạm vi vượt 7% (đợt chạy thử là 4,9%) TRONG 1 tuần THÌ PM trợ lý hoàn phí rà 20 trace làm lại và tạm dừng hang_nang KHÔNG THÌ không được giảm tỉ lệ xem lại"
  interim_looks: "Chỉ kiểm tra chỉ số an toàn (mở lại 7 ngày, hoàn trùng) và chi phí mỗi tuần; không xem chỉ số chính trước ngày quyết định"
  rollback: "Giám đốc vận hành bấm cờ tắt trợ lý, hiệu lực trong 30 phút; mọi yêu cầu mới chuyển sang luồng nhân viên tự làm (6 phút/yêu cầu); yêu cầu đang dở được handoff_to_staff kèm tóm tắt"
  decision_date: "2027-01-05"
  simulated_inputs:
    - "Chi phí mỗi việc thành công 4.472 đ (toàn mẫu) và 3.414 đ (noi_dia + hang_nang), simulated"
    - "Tỉ lệ so với 12.000 đ theo loại: 0,22× · 0,69× · 1,88× · 0,85×, simulated"
    - "Chi phí cộng cố định 4.599 đ (0,38×) và 5.784 đ (0,48×) ở nửa khối lượng, simulated"
    - "Bảng độ nhạy B1: làm lại +51,8%, xem lại +40,7%, lương +23,1%, simulated"
    - "Xem lại 100%: 11.743 đ (0,98×) và 12.415 đ (1,03×) với 15,3 phút làm lại, simulated"
    - "Phút xem lại 890 và phút làm lại 1.132 trong mẫu, simulated"
    - "Ngưỡng 8.000 đ của luật dừng chi phí dựa trên các số simulated ở trên"
